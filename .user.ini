; ============================================================================
; ORS PHP PROJECT LEVEL CONFIG - LAYER PALING KERAS
; Catatan: Setting ini DI MUAT OLEH PHP PADA FASE STARTUP PARSING REQUEST -
; SEBELUM BARIS PERTAMA KODE USER (public/index.php L1) DI EKSEKUSI.
; ============================================================================

; --- KUNCI: MATIKAN STARTUP NOTICE SEBELUM BISA MUNCUL KE BROWSER -----------
display_errors         = Off
display_startup_errors = Off
html_errors            = Off
log_errors             = On
error_reporting        = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- LAYER 0: AUTO PREPEND SCRIPT (jalankan prepend_temp.php SEBELUM script utama)
auto_prepend_file      = "C:\Users\MABRUR\Herd\optimum-race\prepend_temp.php"

; --- PATH DIRECTORY ----------------------------------------------------------
upload_tmp_dir         = "C:\Users\MABRUR\Herd\optimum-race\storage\app\tmp"
sys_temp_dir           = "C:\Users\MABRUR\Herd\optimum-race\storage\app\tmp"
session.save_path      = "C:\Users\MABRUR\Herd\optimum-race\storage\framework\sessions"
soap.wsdl_cache_dir    = "C:\Users\MABRUR\Herd\optimum-race\storage\framework\cache"
opcache.file_cache     = "C:\Users\MABRUR\Herd\optimum-race\storage\framework\cache\opcache"
error_log              = "C:\Users\MABRUR\Herd\optimum-race\storage\logs\php\php_error.log"

; --- UPLOAD / EXECUTION LIMITS -----------------------------------------------
memory_limit           = 512M
upload_max_filesize    = 32M
post_max_size          = 32M
max_execution_time     = 120
max_input_time         = 120
